<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      // レンダラーを作成
      const canvasElement = document.querySelector("#myCanvas");
      const renderer = new THREE.WebGLRenderer({
        canvas: canvasElement,
      });
    //   renderer.setPixelRatio(window.devicePixelRatio);
    //   renderer.setSize(width, height);

      // シーンを作成
      const scene = new THREE.Scene();

      // カメラを作成
      const camera = new THREE.PerspectiveCamera(45, 1.0);

      // カメラの回転パラメータ
      const cameraDistance = 100; // カメラと対象の距離
      const cameraHeight = 30;    // カメラの高さ
      const target = new THREE.Vector3(0, 0, 0); // 注視点
      const initialAngle = Math.PI * (-5 / 180); // 初期角度: 5°左に回転
      let cameraAngle = initialAngle; // 現在のカメラ角度（ラジアン）
      let targetCameraAngle = initialAngle; // 目標のカメラ角度
      const easing = 0.03; // イージングの強さ（小さいほど滑らか・余韻が出る）
      const rotationRange = Math.PI * (15 / 180); // 回転範囲（±15度）

      // カメラ位置を更新する関数
      function updateCameraPosition() {
        // イージングで滑らかに目標角度に近づく
        cameraAngle += (targetCameraAngle - cameraAngle) * easing;

        camera.position.x = target.x + cameraDistance * Math.sin(cameraAngle);
        camera.position.y = cameraHeight;
        camera.position.z = target.z + cameraDistance * Math.cos(cameraAngle);
        camera.lookAt(target);
      }

      // 初期位置を設定
      updateCameraPosition();

      // マウス移動でカメラを回転（ドラッグ不要）
      canvasElement.addEventListener("mousemove", (event) => {
        // マウスのX位置を-1〜1の範囲に正規化
        const rect = canvasElement.getBoundingClientRect();
        const normalizedX = ((event.clientX - rect.left) / rect.width) * 2 - 1;

        // 正規化された位置を回転角度に変換（初期角度を基準に±15度）
        targetCameraAngle = initialAngle - normalizedX * rotationRange;
      });

      // ライト
      const directionalLight = new THREE.DirectionalLight(0xffffff);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);

      const directionalLight2 = new THREE.DirectionalLight(0xffffff);
      directionalLight2.position.set(1, 0, 1);
      scene.add(directionalLight2);
      
      // 環境光（モデルが真っ暗になるのを防ぐため追加推奨）
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      // ★重要変更点1：先にループを開始してしまう
      // これでモデルの読み込み結果に関わらず、画面は描画されます
      tick();

      loadModel();

      async function loadModel() {
        const loader = new GLTFLoader();
        try {
            // 読み込み試行
            const gltf = await loader.loadAsync("resources/scene.gltf");
            const model = gltf.scene;
            
            // スケール調整
            model.scale.set(7, 7, 7);
            scene.add(model);
            
            console.log("読み込み成功！");
        } catch (error) {
            // エラーが起きたらコンソールに表示
            console.error("モデルの読み込みに失敗しました。", error);
            alert("モデル読み込みエラー。F12キーを押してConsoleを確認してください。");
        }
      }

      function tick() {
        updateCameraPosition(); // イージングを適用
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }

      onResize();
      // リサイズイベント発生時に実行
      window.addEventListener("resize", onResize);

      function onResize() {
        // サイズを取得
        const width = window.innerWidth;
        const height = window.innerHeight;

        // レンダラーのサイズを調整する
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(width, height);

        // カメラのアスペクト比を正す
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
    </script>
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
</html>
